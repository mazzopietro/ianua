name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ianua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ianua"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ianua
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ianua_test
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d postgres \
            -c "CREATE DATABASE ianua_test;"

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest -v